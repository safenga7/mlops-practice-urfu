services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: final-mlops-app:latest
    container_name: final-mlops-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
