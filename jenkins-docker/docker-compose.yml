services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins-mlops:lts-jdk21
    container_name: jenkins-mlops
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    environment:
      - JAVA_OPTS=-Xmx1024m -Xms512m -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - /Users/ahmed/Documents/mlops_practice:/workspace/mlops_practice:ro

volumes:
  jenkins_home:
    name: jenkins_home
